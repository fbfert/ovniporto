# OVNIPORTO local stack.
#   make up        build and start everything (http://localhost:${APP_PORT:-8080})
#   make down      stop and remove containers (named volumes are kept)
#
# Images are self-contained (code, vendor and compiled assets baked in), so
# run `make build` after changing code. For live PHP editing, uncomment the
# bind mounts on `app` / `worker` (requires local vendor/ and public/build).

name: ovniporto

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: ovniporto/app:dev

x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  # Same values (and defaults) the mysql service is initialised with.
  DB_DATABASE: ${DB_DATABASE:-ovniporto}
  DB_USERNAME: ${DB_USERNAME:-ovniporto}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_HOST: redis
  INERTIA_SSR_URL: http://ssr:13714
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis

services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: ovniporto/web:dev
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage-data:/var/www/html/storage:ro
      # Access logs survive rebuilds, so the 6-month rotation (docker/nginx/logrotate.conf) is what ends them.
      - nginx-logs:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped

  app:
    <<: *app-image
    env_file: .env
    environment:
      <<: *app-env
    volumes:
      - storage-data:/var/www/html/storage
      # - ./app:/var/www/html/app
      # - ./resources/views:/var/www/html/resources/views
      # - ./routes:/var/www/html/routes
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      ssr:
        condition: service_started
    restart: unless-stopped

  ssr:
    build:
      context: .
      dockerfile: docker/ssr/Dockerfile
    image: ovniporto/ssr:dev
    expose:
      - "13714"
    restart: unless-stopped

  # Plain queue worker for now. Horizon replaces this service command
  # (`php artisan horizon`) once laravel/horizon is installed in a later change.
  worker:
    <<: *app-image
    command: ["php", "artisan", "queue:work", "--tries=3"]
    env_file: .env
    environment:
      <<: *app-env
    volumes:
      - storage-data:/var/www/html/storage
      # - ./app:/var/www/html/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ovniporto}
      MYSQL_USER: ${DB_USERNAME:-ovniporto}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Cookieless metric (Umami) with its own Postgres. Off by default locally:
  #   docker compose --profile analytics up -d   → http://localhost:${UMAMI_PORT:-3001}
  # The site only prints the script in production (UMAMI_SCRIPT_URL + UMAMI_WEBSITE_ID).
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    profiles: ["analytics"]
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me}
      DISABLE_TELEMETRY: 1
    ports:
      - "${UMAMI_PORT:-127.0.0.1:3001}:3000"
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped

  umami-db:
    image: postgres:16-alpine
    profiles: ["analytics"]
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - umami-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  storage-data:
  umami-data:
  nginx-logs:
