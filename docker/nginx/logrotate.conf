# Access and error logs carry visitors' IPs: kept 6 months at most
# (26 weekly files, and maxage as a second guard). See config/privacy.php.
/var/log/nginx/*.log {
    weekly
    rotate 26
    maxage 183
    missingok
    notifempty
    compress
    delaycompress
    dateext
    sharedscripts
    postrotate
        [ -f /tmp/nginx.pid ] && kill -USR1 "$(cat /tmp/nginx.pid)"
    endscript
}
