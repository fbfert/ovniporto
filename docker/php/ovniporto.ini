; OVNIPORTO PHP settings (copied into conf.d by docker/php/Dockerfile).

; Photos: up to 8 MB per file (UploadSightingPhotoRequest::MAX_KB, panel images);
; nginx accepts 20 MB bodies (docker/nginx/default.conf).
upload_max_filesize = 10M
post_max_size = 24M

; Decoding a 24-megapixel JPEG takes ~96 MB in GD before the upright and resize copies:
; 128 MB (the default) is not enough for the photo pipeline.
memory_limit = 384M

; Visitors never see PHP details.
expose_php = Off
