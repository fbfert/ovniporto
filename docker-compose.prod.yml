# OVNIPORTO production stack (the VPS). Used by deploy.sh; see DEPLOY.md.
#
#   docker compose -f docker-compose.prod.yml up -d                     # behind the VPS's own proxy
#   docker compose -f docker-compose.prod.yml --profile caddy up -d     # Caddy takes 80/443 itself
#
# The site answers on WEB_BIND (127.0.0.1:8080 by default): the reverse proxy (the VPS's own,
# or the Caddy profile below) does HTTPS, HTTP/2-3, www and HTTP redirects.
# Images are tagged by release (RELEASE=<git sha>), so deploy.sh can go back to the previous one.
# Secrets come only from .env (never from this file): missing ones stop the stack from starting.

name: ovniporto

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: production
  image: ovniporto/app:${RELEASE:-latest}

x-app-env: &app-env
  APP_ENV: production
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  REDIS_HOST: redis
  INERTIA_SSR_ENABLED: "true"
  INERTIA_SSR_URL: http://ssr:13714
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_SECURE_COOKIE: "true"
  LOG_CHANNEL: stderr

x-app: &app
  <<: *app-image
  env_file: .env
  environment:
    <<: *app-env
  volumes:
    - storage-data:/var/www/html/storage
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: ovniporto/web:${RELEASE:-latest}
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - storage-data:/var/www/html/storage:ro
      # Kept across releases, so the 6-month rotation (logrotate.conf) is what ends them.
      - nginx-logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  app:
    <<: *app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ssr:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && pgrep php-fpm >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  ssr:
    build:
      context: .
      dockerfile: docker/ssr/Dockerfile
    image: ovniporto/ssr:${RELEASE:-latest}
    expose:
      - "13714"
    restart: unless-stopped

  # Horizon: the Redis queue workers (3 tries per job) and their panel at /painel/filas.
  worker:
    <<: *app
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -qi running || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Scheduled commands (routes/console.php): sitemap, abandoned orders, tracking, privacy purge...
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  # Server cards of Pulse (/painel/saude).
  pulse:
    <<: *app
    command: ["php", "artisan", "pulse:check"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  # Cookieless metric (UMAMI_SCRIPT_URL/UMAMI_WEBSITE_ID in .env point the site at it).
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env}
      DISABLE_TELEMETRY: 1
    ports:
      - "${UMAMI_BIND:-127.0.0.1:3001}:3000"
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped

  umami-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Only when ports 80/443 are free on the VPS: automatic HTTPS (Let's Encrypt), HTTP/2 and 3,
  # www and HTTP redirects to the canonical domain (docker/caddy/Caddyfile).
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-ovniporto.tars.art.br}
      METRIC_DOMAIN: ${METRIC_DOMAIN:-metrica.ovniporto.tars.art.br}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  storage-data:
  nginx-logs:
  umami-data:
  caddy-data:
  caddy-config:
